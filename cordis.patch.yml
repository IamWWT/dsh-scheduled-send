# dsh-scheduled-send — 定时任务插件 bundle patch。
#
# 0.8.0 起：
#   - 调度/持久化/重复规则/会话投递全部复用宿主公开服务 ctx.schedule
#     （@deepseek-ai/dsh-schedule；官方 Schedule 的定时器跑在常驻 host 进程）；
#   - 本插件只提供 WorkBuddy 式表单/列表、工作区任务会话、截止时间与执行状态；
#   - 官方客户端 ui-schedule 建议在 profile 层禁用（见 README「隐藏官方 UI」），
#     调度服务本身不受影响。
#
# 注意：config 只声明代码实际消费的键（PluginConfig 仅 stateDir）。
- insert:
  - id: scheduled-send
    name: dsh-scheduled-send
    config:
      # 插件元数据目录；留空 = $DSH_HOME/profiles/<profile>/scheduled-send
      # （tasks-meta.json：截止时间 / 工作区 / 最近执行结果；官方任务行不在这里）
      stateDir: ""
